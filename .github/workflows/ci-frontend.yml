name: CI - FrontEnd (.NET 8)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Block appsettings.json in repository
        shell: pwsh
        run: |
          $tracked = git ls-files appsettings*.json
          if ($tracked) {
            Write-Host "❌ Se detectaron archivos appsettings trackeados en el repositorio:"
            $tracked | ForEach-Object { Write-Host "   - $_" }
            Write-Host ""
            Write-Host "Agrega estos archivos al .gitignore y eliminalos del tracking con:"
            Write-Host "   git rm --cached appsettings.json"
            exit 1
          }
          Write-Host "✅ No se encontraron archivos appsettings.json en el repositorio."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Security scan - NuGet packages (pilot)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet list package --vulnerable --include-transitive `
            | Tee-Object -FilePath vulnerable-packages.txt

          if (Select-String -Path vulnerable-packages.txt -Pattern "vulnerable" -Quiet) {
            Write-Host "Posibles vulnerabilidades detectadas (piloto: no bloquea)." -ForegroundColor Yellow
          } else {
            Write-Host "No se reportan vulnerabilidades por dotnet list package" -ForegroundColor Green
          }

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint JavaScript (ESLint)
        run: npx eslint@9 "wwwroot/js/**/*.js"

      - name: Build (Release)
        id: build_release
        run: dotnet build -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish (Release)
        run: dotnet publish -c ${{ env.BUILD_CONFIGURATION }} /p:PublishDir=publish --no-build

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath frontend_publish.zip -Force

      - name: Upload artifact (publish zip)
        uses: actions/upload-artifact@v4
        with:
          name: frontend_publish
          path: frontend_publish.zip
          retention-days: 14