name: CI - FrontEnd (.NET 8)

on:
  push:
    branches: [ "quickpass" ]
  pull_request:
    branches: [ "quickpass" ]
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate appsettings policy
        shell: pwsh
        run: |
          $tracked = git ls-files "appsettings*.json"
          $allowed = @("appsettings.template.json")
          $forbidden = @()

          foreach ($file in $tracked) {
            if ($allowed -notcontains $file) {
              $forbidden += $file
            }
          }

          if ($forbidden.Count -gt 0) {
            Write-Host "❌ Se detectaron archivos appsettings prohibidos en el repositorio:"
            $forbidden | ForEach-Object { Write-Host "   - $_" }
            Write-Host ""
            Write-Host "Solo se permite: appsettings.template.json"
            exit 1
          }

          Write-Host "✅ Política de appsettings correcta."

      - name: Validate generated/runtime files are not tracked
        shell: pwsh
        run: |
          $patterns = @(
            "node_modules/*",
            "bin/*",
            "obj/*",
            "publish/*",
            "App_Data/*",
            "*.db",
            "*.sqlite"
          )

          $found = @()

          foreach ($pattern in $patterns) {
            $matches = git ls-files $pattern
            if ($matches) {
              $found += $matches
            }
          }

          $found = $found | Sort-Object -Unique

          if ($found.Count -gt 0) {
            Write-Host "❌ Se detectaron archivos/carpetas generados o de runtime trackeados:"
            $found | ForEach-Object { Write-Host "   - $_" }
            exit 1
          }

          Write-Host "✅ No se detectaron archivos generados trackeados."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Security scan - NuGet packages (pilot)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet list package --vulnerable --include-transitive `
            | Tee-Object -FilePath vulnerable-packages.txt

          if (Select-String -Path vulnerable-packages.txt -Pattern "vulnerable" -Quiet) {
            Write-Host "Posibles vulnerabilidades detectadas (piloto: no bloquea)." -ForegroundColor Yellow
          } else {
            Write-Host "No se reportan vulnerabilidades por dotnet list package" -ForegroundColor Green
          }

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint JavaScript (ESLint)
        run: npm run lint

      - name: Build (Release)
        run: dotnet build -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish (Release)
        run: dotnet publish -c ${{ env.BUILD_CONFIGURATION }} -o publish --no-build

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath frontend_publish.zip -Force

      - name: Upload artifact (publish zip)
        uses: actions/upload-artifact@v4
        with:
          name: frontend_publish
          path: frontend_publish.zip
          retention-days: 14s