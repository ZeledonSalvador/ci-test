name: CI - FrontEnd (.NET 8) 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_CONFIGURATION: Release

    steps:
      # 1) Descarga el código del repositorio al runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Instala la versión de .NET necesaria (net8.0)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 3) Restaura paquetes NuGet (dependencias)
      - name: Restore dependencies
        run: dotnet restore

      # 4) Compila en modo Release (gate principal)
      - name: Build (Release)
        run: dotnet build -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      # 5) Publica la aplicación (salida lista para desplegar en IIS)
      - name: Publish (Release)
        run: dotnet publish -c ${{ env.BUILD_CONFIGURATION }} -o publish --no-build

      # 6) Empaqueta la salida publicada en un ZIP
      - name: Zip publish output
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath frontend_publish.zip -Force

      # 7) Sube el ZIP como artifact del run (descargable desde Actions)
      - name: Upload artifact (publish zip)
        uses: actions/upload-artifact@v4
        with:
          name: frontend_publish
          path: frontend_publish.zip
          retention-days: 14

      # 8) Resumen visual en la pestaña "Summary" del run
      - name: Generate GitHub Job Summary
        if: always()
        shell: pwsh
        run: |
          $summary = @"
          # ✅ CI - FrontEnd (.NET 8) (Minimal)

          **Estado:** completado

          ## 📦 Artefacto generado
          - **frontend_publish.zip** (retención: 14 días)

          ## 🔧 Configuración
          - **Runner:** ${{ runner.os }}
          - **Build:** ${{ env.BUILD_CONFIGURATION }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **Run:** [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
