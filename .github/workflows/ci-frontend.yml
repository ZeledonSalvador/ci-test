name: CI - Dashboard (.NET 8)

on:
  push:
    branches: [ "dashboard" ]
  pull_request:
    branches: [ "dashboard" ]
  workflow_dispatch:

concurrency:
  group: ci-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FrontendQuickpass.sln

      - name: Install ESLint
        shell: pwsh
        run: npm install --no-save eslint

      - name: Create temporary ESLint config
        shell: pwsh
        run: |
          @'
          export default [
            {
              files: ["wwwroot/js/**/*.js"],
              languageOptions: {
                ecmaVersion: 2022,
                sourceType: "script",
                globals: {
                  window: "readonly",
                  document: "readonly",
                  console: "readonly",
                  fetch: "readonly",
                  URL: "readonly",
                  setTimeout: "readonly",
                  clearTimeout: "readonly",
                  setInterval: "readonly",
                  clearInterval: "readonly",
                  FormData: "readonly",
                  Chart: "readonly",
                  Swal: "readonly",
                  $: "readonly",
                  jQuery: "readonly"
                }
              },
              linterOptions: {
                reportUnusedDisableDirectives: "error"
              },
              rules: {
                "no-undef": "error",
                "no-unused-vars": ["error", {
                  "argsIgnorePattern": "^_",
                  "varsIgnorePattern": "^_"
                }],
                "no-unreachable": "error",
                "no-redeclare": "error",
                "no-dupe-keys": "error",
                "no-constant-condition": "error"
              }
            }
          ];
          '@ | Set-Content eslint.config.mjs

      - name: Validate JavaScript
        shell: pwsh
        run: npx eslint "wwwroot/js/**/*.js"

      - name: Build
        shell: pwsh
        run: >
          dotnet build FrontendQuickpass.sln
          -c ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          /p:EnforceCodeStyleInBuild=true
          /p:AnalysisLevel=latest

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish FrontendQuickpass.csproj
          -c ${{ env.BUILD_CONFIGURATION }}
          -o publish
          --no-build

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath frontend_publish.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend_publish
          path: frontend_publish.zip
          retention-days: 7

  