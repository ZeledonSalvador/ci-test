name: CI - FrontEnd (.NET 8)

on:
  push:
    branches: [ "quickpass" ]
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: windows-latest
    needs: secret_scan

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate appsettings policy
        shell: pwsh
        run: |
          $tracked = git ls-files "appsettings*.json"
          $allowed = @("appsettings.template.json")
          $forbidden = @()

          foreach ($file in $tracked) {
            if ($allowed -notcontains $file) {
              $forbidden += $file
            }
          }

          if ($forbidden.Count -gt 0) {
            Write-Host "❌ Se detectaron archivos appsettings prohibidos en el repositorio:"
            $forbidden | ForEach-Object { Write-Host "   - $_" }
            Write-Host ""
            Write-Host "Solo se permite: appsettings.template.json"
            exit 1
          }

          Write-Host "✅ Política de appsettings correcta."

      - name: Validate generated/runtime files are not tracked
        shell: pwsh
        run: |
          $patterns = @(
            "node_modules/*",
            "bin/*",
            "obj/*",
            "publish/*",
            "App_Data/*",
            "*.db",
            "*.sqlite"
          )

          $found = @()

          foreach ($pattern in $patterns) {
            $matches = git ls-files $pattern
            if ($matches) {
              $found += $matches
            }
          }

          $found = $found | Sort-Object -Unique

          if ($found.Count -gt 0) {
            Write-Host "❌ Se detectaron archivos/carpetas generados o de runtime trackeados:"
            $found | ForEach-Object { Write-Host "   - $_" }
            exit 1
          }

          Write-Host "✅ No se detectaron archivos generados trackeados."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Security scan - NuGet packages (pilot)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet list package --vulnerable --include-transitive `
            | Tee-Object -FilePath vulnerable-packages.txt

          if (Select-String -Path vulnerable-packages.txt -Pattern "vulnerable" -Quiet) {
            Write-Host "Posibles vulnerabilidades detectadas (piloto: no bloquea)." -ForegroundColor Yellow
          } else {
            Write-Host "No se reportan vulnerabilidades por dotnet list package" -ForegroundColor Green
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint JavaScript (ESLint)
        run: npm run lint

      - name: Build (Release)
        run: dotnet build -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish (Release)
        run: dotnet publish -c ${{ env.BUILD_CONFIGURATION }} -o publish --no-build

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath frontend_publish.zip -Force

      - name: Upload artifact (publish zip)
        uses: actions/upload-artifact@v4
        with:
          name: frontend_publish
          path: frontend_publish.zip
          retention-days: 14

      - name: Diagnóstico de fallo
        if: failure()
        shell: pwsh
        run: |
          Write-Host "❌ El pipeline falló. Revisá el step que aparece en rojo arriba." -ForegroundColor Red
          Write-Host ""
          Write-Host "📋 Guía de causas y soluciones:" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  🔐 Validate appsettings policy" -ForegroundColor Yellow
          Write-Host "     → Un archivo appsettings*.json está siendo trackeado en git."
          Write-Host "     → Solución:"
          Write-Host "          git rm --cached appsettings.json"
          Write-Host "          Agregar 'appsettings*.json' al .gitignore"
          Write-Host ""
          Write-Host "  📁 Validate generated/runtime files" -ForegroundColor Yellow
          Write-Host "     → Archivos generados (bin/, obj/, node_modules/, *.db) están en el repo."
          Write-Host "     → Solución:"
          Write-Host "          git rm -r --cached <carpeta>"
          Write-Host "          Agregar la carpeta al .gitignore"
          Write-Host ""
          Write-Host "  📦 Restore dependencies" -ForegroundColor Yellow
          Write-Host "     → Falló la restauración de paquetes NuGet."
          Write-Host "     → Verificá versiones en el .csproj o conectividad con nuget.org"
          Write-Host ""
          Write-Host "  🟨 Lint JavaScript (ESLint)" -ForegroundColor Yellow
          Write-Host "     → Errores de ESLint en wwwroot/js/"
          Write-Host "     → Ejecutá localmente: npm run lint"
          Write-Host ""
          Write-Host "  🔨 Build (Release)" -ForegroundColor Yellow
          Write-Host "     → Error de compilación en C# o Razor."
          Write-Host "     → Ejecutá localmente: dotnet build -c Release"
          Write-Host ""
          Write-Host "  📤 Publish (Release)" -ForegroundColor Yellow
          Write-Host "     → Falló la publicación del artefacto."
          Write-Host "     → Ejecutá localmente: dotnet publish -c Release -o publish"