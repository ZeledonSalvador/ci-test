name: CI - FrontendQuickpass (.NET 8)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FrontendQuickpass.sln

      - name: Build
        run: dotnet build FrontendQuickpass.sln -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish
        run: dotnet publish FrontendQuickpass.csproj -c ${{ env.BUILD_CONFIGURATION }} -o publish --no-build

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath frontend_publish.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend_publish
          path: frontend_publish.zip
          retention-days: 7
